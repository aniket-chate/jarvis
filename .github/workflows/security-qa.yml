name: JARVIS Security QA
# Final arbitration regression trigger

on:
  push:
  pull_request:

concurrency:
  group: jarvis-security-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio uvicorn fastapi pydantic python-dotenv pyyaml numpy scikit-learn joblib httpx websockets psutil apscheduler
      - name: Run security regressions
        env:
          GATEWAY_AUTH_TOKEN: ci-test-token
        run: pytest -q tests/test_security_regressions.py
      - name: Run production intent arbitration tests
        run: pytest -q tests/test_intent_arbitrator_production.py
      - name: Install browser display support
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run 20-message real-work black-box harness
        run: xvfb-run -a python tests/test_20_real_work_messages.py
      - name: Run truthful 50-capability readiness QA
        env:
          GATEWAY_AUTH_TOKEN: ci-test-token
        run: pytest -q tests/test_real_world_all_50_routed.py

      - name: Run massive 76-test conversation routing audit
        run: pytest -q -s tests/test_massive_76_conversation_routing.py

      - name: Run 30-turn real conversation QA
        env:
          JARVIS_CI_SKIP_EXTERNAL_MEDIA: "true"
        run: xvfb-run -a python tests/test_30_real_conversation.py
