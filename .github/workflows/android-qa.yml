name: Android Mobile Agent QA

on:
concurrency:
  group: android-mobile-agent-qa-${{ github.ref }}
  cancel-in-progress: true

  push:
    branches:
      - "feature/android-mobile-agent-v1"
      - "refactor/final-intent-arbitration-merge"
  pull_request:
    paths:
      - "client/android/**"
      - ".github/workflows/android-qa.yml"

jobs:
  android-build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: client/android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        run: .\gradlew.bat assembleDebug --stacktrace

      - name: Run JVM tests
        run: .\gradlew.bat test --stacktrace
