name: JARVIS QA

on:
  push:
    branches: ["master", "qa/**"]
  pull_request:
    branches: ["master"]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic python-dotenv pyyaml numpy
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security regressions
        run: pytest -q tests/test_security_regressions.py

  blackbox-20-turns:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install browser display support
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run 20-turn black-box runtime QA
        run: xvfb-run -a python tests/test_blackbox_20_turns.py
