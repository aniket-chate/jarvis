name: JARVIS QA

on:
  push:
    branches: ["master", "qa/**"]
  pull_request:
    branches: ["master"]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic python-dotenv pyyaml numpy
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security regressions
        run: pytest -q tests/test_security_regressions.py
