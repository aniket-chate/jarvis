name: JARVIS QA

on:
  push:
    branches: ["master", "qa/**"]
  pull_request:
    branches: ["master"]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio fastapi httpx pydantic python-dotenv pyyaml numpy psutil apscheduler
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security regressions
        run: pytest -q tests/test_security_regressions.py
      - name: Run 20-message real-work black-box harness
        run: python tests/test_20_real_work_messages.py
      - name: Run production intent arbitration tests
        run: pytest -q tests/test_intent_arbitrator_production.py
        # Production contract: normalization, clarification, context-safe confirmation, and generic capability routing.
