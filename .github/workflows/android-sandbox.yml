name: Android + JARVIS Live Sandbox

on:
  push:
    branches:
      - "feature/android-mobile-agent-v1"
  workflow_dispatch:

concurrency:
  group: android-jarvis-live-sandbox
  cancel-in-progress: true

jobs:
  live-sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install JARVIS server dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio uvicorn fastapi pydantic python-dotenv pyyaml numpy scikit-learn joblib httpx websockets psutil apscheduler

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Start real JARVIS gateway
        env:
          GATEWAY_AUTH_TOKEN: ci-sandbox-token-2026-jarvis-device-mesh-test
          JARVIS_CORS_ORIGINS: http://10.0.2.2,http://localhost,http://127.0.0.1
        run: |
          nohup python -m uvicorn server.app:app --host 0.0.0.0 --port 8000 > /tmp/jarvis-gateway.log 2>&1 &
          for i in $(seq 1 60); do
            if curl --silent --show-error --fail http://127.0.0.1:8000/api/v1/health > /tmp/jarvis-health.json; then
              cat /tmp/jarvis-health.json
              exit 0
            fi
            sleep 2
          done
          cat /tmp/jarvis-gateway.log
          exit 1

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node/kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android app against live JARVIS gateway
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          disk-size: 6000M
          heap-size: 600M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          working-directory: client/android
          script: bash ./gradlew connectedAndroidTest --stacktrace

      - name: Dump gateway log on failure
        if: failure()
        run: cat /tmp/jarvis-gateway.log
