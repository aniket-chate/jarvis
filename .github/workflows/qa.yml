name: JARVIS QA

on:
  push:
    branches: ["master", "qa/**", "fix/**"]
  pull_request:
    branches: ["master"]

jobs:
  security-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Run security regressions
        run: pytest -q tests/test_security_regressions.py
      - name: Run focused manual runtime guards
        run: pytest -q tests/test_manual_runtime_guards.py
      - name: Install browser display support
        run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Run 20-message real-work black-box harness
        run: xvfb-run -a python tests/test_20_real_work_messages.py
      - name: Run 30-turn manual-use acceptance conversation
        run: xvfb-run -a python tests/test_30_manual_conversation.py
